<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>らくがきAI</title>
<meta name="theme-color" content="#FFD54A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="らくがきAI">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: one phase per screen, sticker cards with hard offset shadows on sunshine yellow. */
  --bg:#FFD84D;
  --ink:#1B1B2F;
  --paper:#FFFFFF;
  --pink:#FF5C8A;
  --blue:#2F6BFF;
  --green:#19B36B;
  --orange:#FF8A1F;
  --soft:#FFF3B8;
  --f-display:"Mochiy Pop One","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --shadow:4px 4px 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background-color:var(--bg);
  background-image:radial-gradient(rgba(27,27,47,.13) 1.6px,transparent 1.6px);
  background-size:20px 20px;
  color:var(--ink);
  font-family:var(--f-body);
  font-weight:500;
  font-size:16px;
  line-height:1.5;
  overscroll-behavior:none;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-display);font-weight:400;text-wrap:balance}
/* ページ全体は動かさない(iPhoneのホーム画面アプリで、ページごと上下にずれてスクロールできなくなるのを防ぐ) */
#app{position:fixed;top:0;bottom:0;left:0;right:0;width:100%;max-width:520px;margin:0 auto}
#appdbg{position:fixed;left:0;right:0;bottom:0;z-index:99;background:rgba(0,0,0,.8);color:#0f0;font:11px/1.3 monospace;padding:4px 6px;pointer-events:none;white-space:pre-wrap}
.screen{position:absolute;inset:0;display:none;flex-direction:column;gap:12px;padding:16px;overflow-y:auto;overflow-x:hidden}
.screen.active{display:flex}
.grow{flex:1}
.center{align-items:center;text-align:center}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.pill{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:800;letter-spacing:.04em}

.btn{
  font-family:var(--f-display);font-size:17px;line-height:1.2;color:var(--ink);
  background:var(--paper);border:3px solid var(--ink);border-radius:16px;
  padding:12px 18px;box-shadow:var(--shadow);cursor:pointer;touch-action:manipulation;
}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--pink)}
.btn.blue{background:var(--blue);color:#fff}
.btn.big{width:100%;font-size:22px;padding:16px}
.btn.small{font-size:14px;padding:8px 10px;border-radius:12px;box-shadow:3px 3px 0 var(--ink)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}

[hidden]{display:none!important}
#blind-note{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;text-align:center;font-family:var(--f-display);font-size:22px;line-height:1.5;color:rgba(27,27,47,.3);padding:30px;z-index:1}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mode{display:flex;flex-direction:column;align-items:center;font:inherit;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 4px;cursor:pointer;touch-action:manipulation}
.mode b{font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.3}
.mode small{font-size:11px;font-weight:800}
.mode[aria-pressed="true"]{background:var(--pink);box-shadow:var(--shadow);transform:translate(-1px,-1px)}
.mode-desc{font-size:14px;font-weight:800;line-height:1.5}
.best{font-size:13px;font-weight:800}
.rule-card{background:var(--pink);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:12px 14px;transform:rotate(.8deg)}
.rule-card .k{font-size:12px;font-weight:800}
.rule-card .n{font-family:var(--f-display);font-size:28px;line-height:1.3}
.rule-card .d{font-size:14px;font-weight:800}
.rule-card .b{display:inline-block;margin-top:6px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:12px;font-weight:800}
.bonus{font-size:12px;font-weight:800;background:var(--soft);border:2px solid var(--ink);border-radius:10px;padding:2px 8px}
.stamp{align-self:flex-start;font-family:var(--f-display);font-size:20px;line-height:1.4;border:3px solid var(--ink);border-radius:10px;padding:0 10px;transform:rotate(-4deg);background:var(--green)}
.stamp.ng{background:#E0391F;color:#fff}
.gline{font-size:12px;font-weight:800;line-height:1.4}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.gal-grid button{padding:0;background:none;border:0;font:inherit;color:inherit;cursor:zoom-in;text-align:center}
.gal-grid img{width:100%;aspect-ratio:4/5;object-fit:cover;border:3px solid var(--ink);border-radius:8px;background:#fff;display:block}
.gal-grid span{font-size:11px;font-weight:800;display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rankbox{display:flex;align-items:center;gap:14px}
.rankletter{flex:none;width:92px;height:92px;border-radius:50%;border:3px solid var(--ink);background:#FFC400;display:grid;place-items:center;font-family:var(--f-display);font-size:52px;box-shadow:var(--shadow);transform:rotate(-6deg)}
.rankbox .rt{font-family:var(--f-display);font-size:22px;line-height:1.3}
.rankbox .rp{font-family:var(--f-display);font-size:38px;line-height:1.2}
.ribbon{display:inline-block;background:var(--pink);border:3px solid var(--ink);border-radius:999px;padding:0 12px;font-family:var(--f-display);font-size:14px;transform:rotate(-3deg)}

.me-chip{position:absolute;top:8px;left:8px;z-index:4;display:flex;align-items:center;gap:6px;height:38px;max-width:190px;padding:0 12px 0 4px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font:inherit;font-family:var(--f-display);font-size:14px;color:var(--ink);cursor:pointer;touch-action:manipulation}
.me-chip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app:not([data-scr="title"]) .me-chip{display:none}
#toast{position:absolute;top:54px;left:12px;right:12px;z-index:6;display:flex;gap:8px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:var(--shadow);padding:8px 10px;font-weight:800;font-size:14px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec{font-family:var(--f-display);font-weight:400;font-size:17px}
.codebox{font-family:var(--f-display);font-size:34px;letter-spacing:.14em;text-align:center;line-height:1.3;user-select:all;-webkit-user-select:all}
.shapes{display:flex;gap:10px;justify-content:center}
.shape{padding:6px;border:3px solid var(--ink);border-radius:16px;background:var(--paper);cursor:pointer;touch-action:manipulation}
.shape[aria-pressed="true"]{background:var(--soft);box-shadow:3px 3px 0 var(--ink);transform:translate(-1px,-1px)}
.frow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:2px dashed rgba(27,27,47,.25)}
.frow:last-child{border-bottom:0}
.frow .fn{flex:1;min-width:0;font-family:var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow small{font-size:12px;font-weight:800}
.od{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#C9CDD8;flex:none}
.od.on{background:var(--green)}
.wait{font-weight:800;text-align:center}
.reg-input{font:inherit;font-weight:800;font-size:20px;text-align:center;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:12px;width:100%;-webkit-user-select:text;user-select:text}

/* sound */
.snd{width:38px;height:38px;border:3px solid var(--ink);border-radius:50%;background:var(--paper);box-shadow:3px 3px 0 var(--ink);display:grid;place-items:center;padding:0;cursor:pointer;flex:none;touch-action:manipulation}
.snd:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.snd[aria-pressed="true"]{background:var(--soft)}
#snd{position:absolute;top:8px;right:8px;z-index:4}
#app[data-scr="draw"] #snd{display:none}
.screen:not(.draw){padding-top:56px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.two .sub{font-size:12px;font-weight:800;margin-bottom:4px}

/* title */
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 0;font-family:var(--f-display);font-weight:400}
.logo .row{display:flex;gap:6px}
.logo-sub{margin:2px 0 4px;text-align:center;font-weight:900;font-size:14px;letter-spacing:.04em}
.lc{display:grid;place-items:center;width:56px;height:64px;font-size:36px;border:3px solid var(--ink);border-radius:14px;box-shadow:var(--shadow);transform:rotate(var(--r,0deg));animation:drop .6s cubic-bezier(.2,1.5,.4,1) both;animation-delay:var(--d)}
.logo .row.b .lc{width:68px;height:76px;font-size:44px}
.lc0{background:var(--pink)}.lc1{background:var(--blue);color:#fff}.lc2{background:var(--green)}.lc3{background:var(--orange)}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(calc(var(--r,0deg) - 14deg))}to{opacity:1;transform:translateY(0) rotate(var(--r,0deg))}}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.how .tile{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:8px 6px;text-align:center;font-size:12px;line-height:1.35}
.how .tile b{display:block;font-family:var(--f-display);font-weight:400;font-size:15px}
.how .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:13px;margin-bottom:2px}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-weight:800;font-size:14px}
.seg{display:flex;gap:6px}
.seg button{flex:1;font-family:var(--f-display);font-size:16px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:8px 0;cursor:pointer;touch-action:manipulation}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.names{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.nrow{display:flex;align-items:center;gap:8px}
.nrow input{flex:1;min-width:0;font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:8px 10px;-webkit-user-select:text;user-select:text}
.status{font-size:13px;font-weight:800;min-height:20px;display:flex;gap:6px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--orange);border:2px solid var(--ink);flex:none}
.dot.ok{background:var(--green)}.dot.ng{background:#E0391F}

.avatar{display:inline-flex;flex:none}
.avatar svg{display:block}

/* intro */
.topic-card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);padding:26px 16px;text-align:center;transform:rotate(-1.2deg)}
.topic-card .k{font-weight:800;font-size:13px}
.topic-card .t{font-family:var(--f-display);font-size:34px;line-height:1.3;text-wrap:balance;margin-top:6px;animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
.axes{display:grid;gap:8px}
.axis{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:6px 10px}
.axis i{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);flex:none;background:var(--c)}
.axis b{font-family:var(--f-display);font-weight:400;font-size:16px}
.axis span{font-size:13px;margin-left:auto;opacity:.8}
.judge-row{display:flex;align-items:center;gap:10px}
.badge{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);font-family:var(--f-display);font-size:20px;color:#fff;background:var(--c,#2F6BFF)}
.badge.lg{width:84px;height:84px;font-size:40px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}

/* pass */
.big-avatar{animation:pop .5s cubic-bezier(.2,1.5,.4,1) both}
.pass-name{font-size:30px}
.progress{display:flex;gap:8px;justify-content:center}
.progress .avatar{opacity:.35}
.progress .avatar.done{opacity:1}

/* draw */
.draw{padding:10px 12px;gap:8px;overflow:hidden}
.d-top{display:flex;align-items:center;gap:8px}
.who{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:15px}
.who span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.secs{font-family:var(--f-display);font-size:36px;line-height:1;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.secs.warn{color:#E0391F;animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.18)}}
.topic-chip{background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:4px 10px;font-weight:800;font-size:15px;text-align:center;display:flex;gap:8px;align-items:center;justify-content:center}
.topic-chip em{font-style:normal;background:var(--pink);border:2px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px}
.bar{height:14px;border:3px solid var(--ink);border-radius:10px;background:var(--paper);overflow:hidden;flex:none}
.bar>i{display:block;height:100%;width:100%;background:var(--green)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#cv{background:#fff;border:3px solid var(--ink);border-radius:12px;box-shadow:var(--shadow);touch-action:none;display:block;cursor:crosshair}
.tools{display:flex;flex-direction:column;gap:8px;flex:none}
.swatches{display:flex;flex-wrap:wrap;gap:8px 6px;justify-content:center;padding:0 6px}
.sw{flex:0 0 calc((100% - 42px) / 8);max-width:44px;aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:var(--c);cursor:pointer;padding:0;font-family:var(--f-display);font-size:13px;color:var(--ink);touch-action:manipulation}
.sw[aria-pressed="true"]{transform:scale(1.18);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.row2{display:flex;gap:8px;align-items:center}
.hearts{color:#E0391F;letter-spacing:2px;font-size:18px;font-weight:900}
.hearts .e{color:#b9b9c8}
.hearts small{color:var(--ink);letter-spacing:0;font-size:12px;font-weight:800;margin-left:6px;opacity:.85}
.gc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gc-it{border:3px solid var(--ink);border-radius:12px;background:#fff;aspect-ratio:1;display:grid;place-items:center;align-content:center;font-size:26px;line-height:1.1;text-align:center;cursor:pointer;padding:2px;font-family:inherit;color:var(--ink)}
.gc-it small{font-size:10px;font-weight:800;display:block}
.gc-it.lock{opacity:.5;cursor:default}.gc-it.lock .ic{filter:brightness(0) opacity(.4)}
.gc-it.r-r{border-color:#3C8DFF}.gc-it.r-sr{border-color:#F5B700;box-shadow:0 0 0 2px #FFE58A}.gc-it.r-hr{border-color:#9B4DFF;box-shadow:0 0 8px 2px rgba(155,77,255,.55)}
.gc-it.r-lr{border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#2f6bff,#af52de,#ff3b30) border-box}
.gc-it.r-sec{background:#1B1B2F;color:#FFD23F;border-color:#FFD23F;box-shadow:0 0 10px 2px rgba(255,210,63,.7)}
.gc-row{display:flex;align-items:center;gap:10px}
.gc-ov{position:fixed;inset:0;z-index:80;background:rgba(27,27,47,.88);display:grid;place-items:center;text-align:center;color:#fff;padding:20px}
.gc-cap{font-size:120px;line-height:1;animation:gcShake 1.2s ease-in-out}
@keyframes gcShake{0%,100%{transform:rotate(0) scale(1)}10%{transform:rotate(-16deg)}25%{transform:rotate(14deg) scale(1.05)}40%{transform:rotate(-18deg)}55%{transform:rotate(16deg) scale(1.1)}70%{transform:rotate(-10deg)}85%{transform:rotate(10deg) scale(1.2)}}
.gc-flash{position:fixed;inset:0;z-index:81;background:#fff;pointer-events:none;animation:gcFlash .6s ease-out forwards}
@keyframes gcFlash{0%{opacity:1}100%{opacity:0}}
.gc-res{display:flex;flex-direction:column;align-items:center;gap:10px;max-width:340px;width:100%}
.gc-res .big{font-size:96px;line-height:1;animation:invIn .5s cubic-bezier(.2,1.4,.4,1)}
.gc-res .big .tx{font-size:44px;font-weight:900}
.gc-rar{font-family:var(--f-display);font-size:28px}
.fx-buzz{position:fixed;inset:0;z-index:58;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,90,170,.4),rgba(30,30,110,.75));opacity:0;animation:fxBuzzBg 4s ease forwards}
@keyframes fxBuzzBg{0%{opacity:0}10%{opacity:1}88%{opacity:1}100%{opacity:0}}
.buzz-pill{position:fixed;z-index:62;pointer-events:none;background:#fff;color:#1b1b2f;border-radius:999px;padding:6px 14px;font-weight:900;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.3);opacity:0;white-space:nowrap;animation:buzzPill 1.7s ease-out var(--del,0s) forwards}
@keyframes buzzPill{0%{opacity:0;transform:scale(.3) translateY(14px)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-70px)}}
.buzz-count{position:fixed;inset:0;z-index:63;display:grid;place-content:center;text-align:center;pointer-events:none}
.buzz-count b{display:block;font-family:var(--f-display);font-weight:400;font-size:min(19vw,92px);color:#fff;text-shadow:0 4px 0 #d6245f,0 0 22px #ff5aa8}
.buzz-count span{display:block;font-weight:900;font-size:min(7vw,28px);color:#fff;text-shadow:0 2px 6px #000}
.buzz-final{position:fixed;inset:0;z-index:64;display:grid;place-items:center;pointer-events:none}
.buzz-final b{font-family:var(--f-display);font-weight:400;font-size:min(16vw,76px);background:linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#2f6bff,#af52de);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #fff;opacity:0;animation:fxSec 2.2s ease 1.7s forwards}
@media (prefers-reduced-motion: reduce){.gc-cap,.gc-flash,.gc-res .big,.fx-buzz,.buzz-pill,.buzz-count,.buzz-final{animation:none}.fx-buzz,.buzz-pill,.buzz-final{display:none}}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;margin-left:8px;border-radius:999px;background:#E0391F;color:#fff;border:2px solid #fff;font-size:13px;font-weight:900;vertical-align:middle;animation:badgePulse 1.4s ease-in-out infinite}
.badge[hidden]{display:none}
@keyframes badgePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#inv-modal{position:fixed;inset:0;z-index:70;background:rgba(27,27,47,.65);display:flex;align-items:center;justify-content:center;padding:18px}
#inv-modal .inv{max-width:340px;width:100%;text-align:center;background:#fff;animation:invIn .45s cubic-bezier(.2,1.4,.4,1)}
#inv-modal .inv .env{font-size:64px;line-height:1;display:inline-block;animation:envWob 1s ease-in-out infinite}
@keyframes invIn{0%{transform:scale(.4) translateY(40px);opacity:0}100%{transform:none;opacity:1}}
@keyframes envWob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.1)}}
@media (prefers-reduced-motion: reduce){.badge,#inv-modal .inv,#inv-modal .inv .env{animation:none}}
.pens{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:0 6px}
.pn{min-width:44px;height:40px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer;padding:0 8px;font-size:18px;touch-action:manipulation}
.pn[aria-pressed="true"]{background:var(--soft);box-shadow:2px 2px 0 var(--ink)}
.pn[hidden]{display:none}
.sizes{display:flex;gap:6px;margin-right:auto}
.sz{width:40px;height:40px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:12px;background:var(--paper);cursor:pointer;padding:0;touch-action:manipulation}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.sz[aria-pressed="true"]{background:var(--soft);box-shadow:2px 2px 0 var(--ink)}

/* judge */
.dots{display:flex;gap:8px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--ink);animation:bounce .9s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.btn.on{background:var(--pink);color:#fff}
.err{background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:12px;font-weight:800;box-shadow:var(--shadow)}

/* result */
.rhead{display:flex;gap:10px;align-items:flex-start}
.speech{position:relative;flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:8px 12px;font-size:14px;font-weight:800;line-height:1.45}
.rcard{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:12px;margin-top:6px;opacity:0;animation:cardIn .45s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:calc(var(--i)*240ms + 150ms)}
.stamps{display:flex;flex-wrap:nowrap;gap:6px;margin-top:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
.stp{flex:none}
.stp.r-r{border-color:#3C8DFF}
.stp.r-sr{border-color:#F5B700;box-shadow:0 0 0 2px #FFE58A}
.stp.r-hr{border-color:#9B4DFF;box-shadow:0 0 8px 2px rgba(155,77,255,.55)}
.stp.r-lr{border:3px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#ff3b30,#ff9500,#ffd60a,#34c759,#2f6bff,#af52de,#ff3b30) border-box;box-shadow:0 0 10px 2px rgba(255,200,0,.6)}
.stp.r-sec{background:#1B1B2F;color:#FFD23F;border-color:#FFD23F;box-shadow:0 0 12px 3px rgba(255,210,63,.75);animation:secGlow 1.6s ease-in-out infinite}
.stp.r-sec[aria-pressed="true"],.stp.r-lr[aria-pressed="true"],.stp.r-hr[aria-pressed="true"]{background:var(--pink);color:#fff}
.stp .tx{font-weight:900;font-size:14px;letter-spacing:.5px}
@keyframes secGlow{0%,100%{box-shadow:0 0 8px 2px rgba(255,210,63,.5)}50%{box-shadow:0 0 18px 6px rgba(255,210,63,.95)}}
@keyframes stpPop{0%{transform:scale(1)}40%{transform:scale(1.5) rotate(-8deg)}100%{transform:scale(1)}}
@keyframes stpWob{0%,100%{transform:rotate(0)}20%{transform:rotate(-16deg)}40%{transform:rotate(14deg)}60%{transform:rotate(-9deg)}80%{transform:rotate(6deg)}}
.stp.fx-pop{animation:stpPop .5s ease-out}
.stp.fx-wob{animation:stpWob .9s ease-in-out}
.fx-p{position:fixed;z-index:60;pointer-events:none;font-weight:900;line-height:1;white-space:nowrap;text-shadow:0 2px 0 rgba(255,255,255,.9),0 0 6px rgba(255,255,255,.9);animation:fxPart var(--dur,1s) ease-out var(--del,0s) forwards;opacity:0}
@keyframes fxPart{0%{opacity:1;transform:translate(0,0) scale(.5) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(var(--sc,1.2)) rotate(var(--rot,0deg))}}
.fx-big{position:fixed;inset:0;z-index:61;pointer-events:none;display:grid;place-items:center}
.fx-big span{font-weight:900;text-shadow:0 6px 0 rgba(0,0,0,.25);animation:fxBig 1.8s ease-out forwards}
@keyframes fxBig{0%{transform:scale(.1) rotate(-25deg);opacity:0}22%{transform:scale(1.15) rotate(5deg);opacity:1}70%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.6);opacity:0}}
.fx-flash{position:fixed;inset:0;z-index:59;pointer-events:none;border:10px solid #ff3b30;animation:fxFlash 1.6s linear forwards}
@keyframes fxFlash{0%{opacity:0;filter:hue-rotate(0)}15%{opacity:1}100%{opacity:0;filter:hue-rotate(360deg)}}
.fx-dark{position:fixed;inset:0;z-index:58;background:#000;pointer-events:none;animation:fxDark 4.2s ease forwards;opacity:0}
@keyframes fxDark{0%{opacity:0}8%{opacity:.8}86%{opacity:.8}100%{opacity:0}}
.fx-rays{position:fixed;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;z-index:59;pointer-events:none;background:repeating-conic-gradient(from 0deg,rgba(255,210,63,.6) 0 7deg,transparent 7deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);animation:fxRays 4.2s linear forwards;opacity:0}
@keyframes fxRays{0%{opacity:0;transform:rotate(0) scale(.3)}15%{opacity:1}86%{opacity:1}100%{opacity:0;transform:rotate(100deg) scale(1.2)}}
.fx-dragon{position:fixed;z-index:62;left:0;top:34%;font-size:min(58vw,250px);line-height:1;pointer-events:none;filter:drop-shadow(0 0 22px #FFD23F);animation:fxDragon 2.7s cubic-bezier(.35,.1,.3,1) .5s forwards;transform:translate(-130%,20vh)}
@keyframes fxDragon{0%{transform:translate(-130%,20vh) rotate(-10deg) scale(.8)}30%{transform:translate(8vw,-8vh) rotate(8deg) scale(1.1)}60%{transform:translate(42vw,10vh) rotate(-6deg) scale(1.2)}100%{transform:translate(135vw,-12vh) rotate(10deg) scale(1)}}
.fx-secret{position:fixed;inset:0;z-index:63;display:grid;place-items:center;pointer-events:none;text-align:center;align-content:center}
.fx-secret b{display:block;font-family:var(--f-display);font-weight:400;font-size:min(17vw,84px);color:#FFD23F;letter-spacing:.1em;text-shadow:0 0 20px #FF9500,0 4px 0 #7a4b00;opacity:0;animation:fxSec 3s ease .9s forwards}
.fx-secret small{display:block;font-size:min(7vw,30px);font-weight:900;color:#fff;margin-top:8px;text-shadow:0 2px 6px #000;opacity:0;animation:fxSec 3s ease 1.2s forwards}
@keyframes fxSec{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.15)}30%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
body.fx-shake{animation:fxShake .45s linear 3}
@keyframes fxShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(5px,4px)}}
@media (prefers-reduced-motion: reduce){.fx-p,.fx-big,.fx-flash,.fx-dark,.fx-rays,.fx-dragon,.fx-secret{display:none}.stp.fx-pop,.stp.fx-wob,.stp.r-sec{animation:none}body.fx-shake{animation:none}}
.stp{display:inline-flex;align-items:center;gap:4px;border:2.5px solid var(--ink);border-radius:999px;background:#fff;padding:3px 9px;font-size:18px;line-height:1.3;cursor:pointer;touch-action:manipulation;color:var(--ink);font-family:inherit}
.stp .ct{font-family:var(--f-display);font-size:13px}
.stp .ct:empty{display:none}
.stp[aria-pressed="true"]{background:var(--pink);color:#fff}
.stp:active{transform:scale(.92)}
.fly{position:fixed;z-index:60;pointer-events:none;font-size:28px;animation:fly .9s ease-out forwards}
@keyframes fly{from{opacity:1;transform:translateY(0) scale(1)}to{opacity:0;transform:translateY(-90px) scale(1.7)}}
@media (prefers-reduced-motion: reduce){.fly{display:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.rank{position:absolute;top:-12px;left:-6px;font-family:var(--f-display);font-size:16px;padding:2px 12px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);transform:rotate(-5deg)}
.rank.r1{background:#FFC400;font-size:19px}.rank.r2{background:#D9DEE8}.rank.r3{background:#E8A66B}
.rbody{display:flex;gap:12px}
.thumb{flex:none;width:118px;aspect-ratio:4/5;padding:0;border:3px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;cursor:zoom-in}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.alb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alb-it{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:0;overflow:hidden;text-align:center;font:inherit;color:var(--ink);cursor:pointer}
.alb-it img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;background:#fff}
.alb-it .q{aspect-ratio:4/5;display:grid;place-items:center;font-family:var(--f-display);font-size:34px;color:rgba(27,27,47,.35);background:repeating-linear-gradient(45deg,#f1f1f1,#f1f1f1 8px,#e4e4e4 8px,#e4e4e4 16px)}
.alb-it span{display:block;font-size:11px;font-weight:800;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alb-it .sc{position:absolute;top:4px;right:4px;background:var(--ink);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;font-weight:900}
.alb-it.no{cursor:default;opacity:.85}
.alb-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.alb-chips button{flex:none;font:inherit;font-weight:800;font-size:12px;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:3px 10px}
.alb-chips button[aria-pressed="true"]{background:var(--ink);color:#fff}
.blk img{visibility:hidden}
.blk{background:repeating-linear-gradient(45deg,#eee,#eee 6px,#d9d9d9 6px,#d9d9d9 12px)!important;cursor:default!important}
.rname{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:15px;min-width:0}
.rname span.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rtotal{display:flex;align-items:baseline;gap:4px;line-height:1}
.rtotal b{font-family:var(--f-display);font-weight:400;font-size:40px}
.rtotal small{font-weight:800;font-size:14px}
.rtotal .sum{margin-left:auto;font-size:12px;font-weight:800;opacity:.8}
.arow{display:grid;grid-template-columns:62px 1fr 20px;gap:6px;align-items:center;font-size:12px;font-weight:800}
.arow .tr{height:12px;border:2px solid var(--ink);border-radius:8px;background:var(--soft);overflow:hidden}
.arow .tr i{display:block;height:100%;width:0;background:var(--c);animation:fill .7s ease-out forwards;animation-delay:calc(var(--i)*240ms + 500ms)}
@keyframes fill{to{width:var(--w)}}
.arow .n{text-align:right;font-variant-numeric:tabular-nums}
.bubble{margin-top:10px;background:var(--soft);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:14px;font-weight:800;line-height:1.5}
.seen{margin-top:6px;font-size:12px;opacity:.8;font-weight:800}
.foot{position:sticky;bottom:0;padding-top:8px;margin-top:auto;background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* final */
.winner{text-align:center;position:relative;padding:22px 14px 16px;background:var(--pink)}
.winner .crown{position:absolute;top:-30px;left:50%;transform:translateX(-50%) rotate(-6deg)}
.winner h2{font-size:22px}
.winner .wn{font-family:var(--f-display);font-size:34px;line-height:1.2;margin-top:4px}
.winner .ws{font-weight:800;font-size:15px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed rgba(27,27,47,.35)}
.lrow:last-child{border-bottom:0}
.lrow .rk{font-family:var(--f-display);font-size:18px;min-width:38px}
.lrow .info{flex:1;min-width:0}
.lrow .info b{font-family:var(--f-display);font-weight:400;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .info small{font-size:12px;font-weight:800;opacity:.8}
.lrow .tt{font-family:var(--f-display);font-size:26px}
.gal{display:grid;gap:12px}
.gal h3{font-size:14px;font-weight:800;margin-bottom:6px}
.gal-row{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.gal-row button{padding:0;background:none;border:0;font:inherit;color:inherit;cursor:zoom-in;text-align:center}
.gal-row img{width:100%;aspect-ratio:4/5;object-fit:cover;border:3px solid var(--ink);border-radius:8px;background:#fff;display:block}
.gal-row span{font-size:11px;font-weight:800;display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-16px;width:10px;height:16px;border:2px solid var(--ink);animation:fall 2.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

#lightbox{position:fixed;inset:0;z-index:10;background:rgba(27,27,47,.82);display:grid;place-items:center;padding:20px;cursor:zoom-out}
#lightbox[hidden]{display:none}
#lightbox img{max-width:100%;max-height:100%;background:#fff;border:4px solid var(--ink);border-radius:12px}


/* ---- タブ型ホーム ---- */
#tabbar{display:none;position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:3px solid var(--ink);padding:0 6px calc(4px + env(safe-area-inset-bottom))}
#app[data-scr="title"] #tabbar,#app[data-scr="online"] #tabbar,#app[data-scr="gacha"] #tabbar,#app[data-scr="mis"] #tabbar{display:flex}
#app[data-scr="title"] .screen.active,#app[data-scr="online"] .screen.active,#app[data-scr="gacha"] .screen.active,#app[data-scr="mis"] .screen.active{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
#tabbar .tab{flex:1;position:relative;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:0;padding:7px 0 3px;font-family:var(--f-display);font-size:12px;line-height:1.3;color:var(--ink);cursor:pointer;touch-action:manipulation}
#tabbar .tab .ic{font-size:25px;line-height:1.15}
#tabbar .tab .badge{position:absolute;top:1px;right:calc(50% - 32px);margin:0;min-width:20px;height:20px;padding:0 4px;font-size:11px;border-width:2px}
#app[data-scr="title"] #tab-home,#app[data-scr="online"] #tab-online,#app[data-scr="gacha"] #tab-gacha,#app[data-scr="mis"] #tab-mis{color:#D92B6B}
#app[data-scr="title"] #tab-home::after,#app[data-scr="online"] #tab-online::after,#app[data-scr="gacha"] #tab-gacha::after,#app[data-scr="mis"] #tab-mis::after{content:"";position:absolute;top:-3px;left:22%;right:22%;height:4px;border-radius:0 0 4px 4px;background:#D92B6B}
#app[data-net="0"] #tabbar .tab.net{display:none}
#app[data-scr="title"] .me-chip{max-width:132px}
.hud{position:absolute;top:8px;right:54px;z-index:4;display:flex;gap:6px}
.hchip{display:flex;align-items:center;gap:4px;height:38px;padding:0 10px;border:3px solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:3px 3px 0 var(--ink);font-family:var(--f-display);font-size:15px;color:var(--ink);cursor:pointer;touch-action:manipulation}
.hchip .hr{color:#E0391F}
.mbig{width:100%;display:flex;align-items:center;gap:14px;padding:11px 16px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;touch-action:manipulation}
.mbig:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.mbig .mic{width:50px;height:50px;border-radius:15px;background:#fff;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:28px;flex:none}
.mbig b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.25}
.mbig small{font-weight:800;font-size:12px;line-height:1.35;display:block}
.dcard{width:100%;display:flex;align-items:center;gap:12px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;padding:10px 14px;touch-action:manipulation}
.dcard:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.dcard .mic{width:46px;height:46px;border-radius:14px;background:#FFE066;border:2.5px solid var(--ink);display:grid;place-items:center;font-size:24px;flex:none}
.dcard b{display:block;font-family:var(--f-display);font-weight:400;font-size:17px}
.dcard small{font-weight:800;font-size:12px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .rcard{opacity:1}
  .arow .tr i{width:var(--w)}
}
@media (max-height:620px){
  .logo .row.b .lc{height:60px;font-size:36px}
  .lc{height:52px;font-size:30px}
}
</style>

(() => {

const JUDGES = [
  { id: 'critic', name: '厳格な美術評論家', mark: '評', color: '#2F6BFF',

function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

/* ---------- sound (Web Audio, no files) ---------- */
const SND = (() => {
  let ac = null, master = null, sfxG = null, bgmG = null, nb = null;
  const st = { mute: false, bgm: true, sfx: true };
  try { const v = JSON.parse(localStorage.getItem('dbSnd') || 'null'); if (v) { st.mute = !!v.mute; st.bgm = v.bgm !== false; st.sfx = v.sfx !== false; } } catch (e) {}
  const save = () => { try { localStorage.setItem('dbSnd', JSON.stringify(st)); } catch (e) {} };
  let want = null, timer = null, nextT = 0, step = 0, tempo = 1;

  const ICON_ON = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="#1B1B2F" stroke="#1B1B2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none"/></svg>';
  const ICON_OFF = '<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="#1B1B2F" stroke="#1B1B2F" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" fill="none"/></svg>';
  function syncBtns() {
    document.querySelectorAll('.snd').forEach(b => {
      b.innerHTML = st.mute ? ICON_OFF : ICON_ON;
      b.setAttribute('aria-pressed', String(st.mute));
      b.setAttribute('aria-label', st.mute ? '音を出す' : '音を消す');
    });
  }
  function apply() {
    if (!ac) return;
    master.gain.value = st.mute ? 0 : 0.9;
    sfxG.gain.value = st.sfx ? 0.55 : 0;
    bgmG.gain.value = st.bgm ? 0.2 : 0;
  }
  function unlock() {
    if (!ac) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return false;
      try { ac = new C(); } catch (e) { return false; }
      master = ac.createGain(); sfxG = ac.createGain(); bgmG = ac.createGain();
      sfxG.connect(master); bgmG.connect(master); master.connect(ac.destination);
      apply();
    }
    if (ac.state !== 'running' && ac.resume) ac.resume();
    refresh();
    return true;
  }
  function tone(f, t, d, o = {}) {
    if (!ac) return;
    const type = o.type || 'square', v = o.v == null ? 0.3 : o.v, g = o.g || sfxG;
    const os = ac.createOscillator(), gn = ac.createGain();
    os.type = type; os.frequency.setValueAtTime(f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + d);
    gn.gain.setValueAtTime(0.0001, t);
    gn.gain.linearRampToValueAtTime(v, t + 0.006);
    gn.gain.exponentialRampToValueAtTime(0.0001, t + d);
    os.connect(gn); gn.connect(g); os.start(t); os.stop(t + d + 0.03);
  }
  function noise(t, d, o = {}) {
    if (!ac) return;
    if (!nb) { nb = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const a = nb.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
    const sr = ac.createBufferSource(); sr.buffer = nb;
    const f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = o.hp || 2000;
    const g = ac.createGain(); const v = o.v == null ? 0.2 : o.v;
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    sr.connect(f); f.connect(g); g.connect(o.g || sfxG); sr.start(t); sr.stop(t + d + 0.03);
  }
  const audible = k => ac && !st.mute && st[k];

  function sfx(name, arg) {
    if (!audible('sfx')) return;
    const t = ac.currentTime;
    switch (name) {
      case 'tap': tone(700, t, 0.07, { v: 0.16, to: 1000 }); break;
      case 'topic': [523, 659, 784, 1047].forEach((f, i) => { tone(f, t + i * 0.09, i === 3 ? 0.4 : 0.12, { v: 0.2 }); tone(f / 2, t + i * 0.09, i === 3 ? 0.4 : 0.12, { type: 'triangle', v: 0.25 }); }); break;
      case 'pass': tone(520, t, 0.1, { v: 0.2 }); tone(780, t + 0.09, 0.18, { v: 0.2 }); break;
      case 'go': tone(880, t, 0.12, { v: 0.22 }); tone(1320, t + 0.1, 0.3, { v: 0.22 }); break;
      case 'tick': tone(1200, t, 0.06, { v: 0.22 }); break;
      case 'buzz': tone(220, t, 0.25, { type: 'sawtooth', v: 0.26 }); tone(165, t + 0.22, 0.45, { type: 'sawtooth', v: 0.26, to: 110 }); break;
      case 'done': tone(600, t, 0.08, { v: 0.2, to: 900 }); tone(900, t + 0.08, 0.16, { v: 0.2 }); break;
      case 'judgeIn': tone(196, t, 0.7, { type: 'triangle', v: 0.4 }); tone(392, t, 0.7, { type: 'triangle', v: 0.25 }); noise(t, 0.3, { hp: 4000, v: 0.12 }); break;
      case 'error': tone(300, t, 0.22, { type: 'sawtooth', v: 0.22, to: 150 }); tone(200, t + 0.2, 0.3, { type: 'sawtooth', v: 0.22, to: 100 }); break;
      case 'reveal':
        if (arg === 1) { [988, 1319].forEach(f => tone(f, t, 0.5, { type: 'triangle', v: 0.3 })); tone(1568, t + 0.08, 0.5, { type: 'triangle', v: 0.2 }); }
        else tone(arg === 2 ? 784 : 622, t, 0.35, { type: 'triangle', v: 0.28 });
        break;
      case 'win':
        [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => { const last = i === 6; tone(f, t + i * 0.11, last ? 0.8 : 0.14, { v: 0.2 }); tone(f / 2, t + i * 0.11, last ? 0.8 : 0.14, { type: 'triangle', v: 0.25 }); });
        noise(t + 0.7, 0.7, { hp: 5000, v: 0.2 });
        break;
    }
  }
  function drumroll() {
    if (!audible('sfx')) return () => {};
    let n = 0;
    const iv = setInterval(() => {
      const t = ac.currentTime, p = Math.min(1, n / 50);
      noise(t, 0.05, { hp: 1800, v: 0.1 + 0.25 * p });
      if (n % 2 === 0) tone(180, t, 0.05, { type: 'triangle', v: 0.1 + 0.15 * p, to: 120 });
      n++;
    }, 65);
    return () => { clearInterval(iv); if (audible('sfx')) noise(ac.currentTime, 0.6, { hp: 3000, v: 0.25 }); };
  }

  /* BGM: a four-bar loop (C - G - Am - F) played by a small step sequencer */
  const ROOT = [130.81, 98, 110, 87.31];
  const PENT = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
  const PAT = [[2, 3, 5, 3, 2, 0, 2, -1], [1, 3, 1, 3, 4, 3, 1, -1], [4, 5, 4, 2, 0, 2, 4, -1], [4, 3, 0, 3, 4, 5, 3, 2]];
  function playStep(sn, t, dur) {
    const bar = Math.floor(sn / 8) % 4, k = sn % 8, hot = want === 'draw';
    const root = ROOT[bar];
    if (hot ? k % 2 === 0 : k % 4 === 0) tone(root, t, dur * (hot ? 1.6 : 3.4), { type: 'triangle', v: 0.55, g: bgmG });
    const m = PAT[bar][k];
    if (m >= 0) tone(PENT[m], t, dur * 0.9, { type: hot ? 'square' : 'triangle', v: hot ? 0.1 : 0.2, g: bgmG });
    if (hot) {
      if (k % 4 === 0) tone(130, t, 0.12, { type: 'sine', v: 0.7, to: 45, g: bgmG });
      if (k % 2 === 1) noise(t, 0.04, { hp: 7000, v: 0.12, g: bgmG });
    }
  }
  function pump() {
    if (!ac) return;
    const now = ac.currentTime;
    if (nextT < now) nextT = now + 0.05;
    while (nextT < now + 0.35) {
      const dur = 60 / (want === 'draw' ? 124 : 100) / 2 / tempo;
      playStep(step, nextT, dur);
      step++; nextT += dur;
    }
  }
  function refresh() {
    const on = ac && want && st.bgm && !st.mute;
    if (on && !timer) { nextT = ac.currentTime + 0.05; timer = setInterval(pump, 90); }
    else if (!on && timer) { clearInterval(timer); timer = null; }
  }
  function bgm(mode) {
    if (mode !== want) { want = mode; step = 0; tempo = 1; }
    refresh();
  }
  function setTempo(x) { tempo = x; }
  function set(key, val) { st[key] = val; save(); apply(); refresh(); }
  function toggleMute() { st.mute = !st.mute; save(); apply(); refresh(); syncBtns(); if (!st.mute) sfx('tap'); }

  document.addEventListener('pointerdown', unlock, true);
  document.addEventListener('visibilitychange', () => {
    if (!ac) return;
    if (document.hidden) ac.suspend && ac.suspend(); else ac.resume && ac.resume();
  });
  document.addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('button');
    if (!b || b.classList.contains('snd') || b.id === 'btn-done') return;
    sfx('tap');
  });
  document.querySelectorAll('.snd').forEach(b => b.addEventListener('click', toggleMute));
  syncBtns();
  return { st, unlock, sfx, bgm, setTempo, drumroll, set };
})();

function makeRelaySample(url) {
  return async (prompt, opt = {}) => {
    const images = await Promise.all((opt.images || []).map(blobToDataURL));
    let r;
    try {
      r = await fetch(url.replace(/\/$/, '') + '/score', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt, images }), signal: opt.signal });
    } catch (e) { if (opt.signal && opt.signal.aborted) throw e; throw { code: 'network' }; }
    let d = null; try { d = await r.json(); } catch (e) {}
    if (r.status === 429) throw { code: d && d.error === 'quota' ? 'quota' : 'rate_limited' };
    if (!r.ok || !d || !d.text) throw { code: 'server', detail: (d && d.error ? d.error : 'no_body') + (d && d.status ? ' ' + d.status : '') + ' / HTTP ' + r.status + (d && d.message ? ' / ' + d.message : '') };
    return { text: d.text, truncated: !!d.truncated };
  };
}

async function initAI() {
  try {
    const sample = await (window.claude && window.claude.use ? window.claude.use('sample') : null);
    if (sample) {
      S.ai.sample = sample;
      let imgOk = true;
      try { const lim = await sample.limits(); imgOk = !!(lim && lim.images); } catch (e) { imgOk = true; }
      S.ai.state = imgOk ? 'ready' : 'noimg';
    } else {
      const url = window.DRAW_CONFIG && window.DRAW_CONFIG.relayUrl;
      if (!url) S.ai.state = 'noconfig';
      else {
        try {
          const r = await fetch(url.replace(/\/$/, '') + '/', { cache: 'no-store' });
          if (!r.ok) throw 0;
          S.ai.sample = makeRelaySample(url); S.ai.state = 'ready';
        } catch (e) { S.ai.state = 'none'; }
      }
    }
  } catch (e) { S.ai.state = 'none'; }
  updateAiStatus();
}

/* ---------- game flow ---------- */
function startGame() {
  const solo = S.mode !== 'battle';
  const n = solo ? 1 : S.n;
  const mine = PROFILE ? PROFILE.name : '';
  S.players = Array.from({ length: n }, (_, i) => ((solo ? S.soloName : S.names[i]) || (i === 0 ? mine : '') || '').trim().slice(0, 8) || (solo ? 'あなた' : 'プレイヤー' + (i + 1)));
  S.total = solo ? S.soloRounds : S.rounds;
  S.totals = Array(n).fill(0);
  S.history = []; S.used = new Set(); S.round = 0; S.lastJudge = null; S.lastRule = null; S.gameSeq = (S.gameSeq || 0) + 1; S.challenge = false;
  newRound();
}

function pickTopic() {
  if (S.forceTopic) { const t = S.forceTopic; S.forceTopic = null; S.used.add(t); return t; }
  const evT = evThemes().filter(t => !S.used.has(t));
  if (evT.length && Math.random() < 0.5) { const t = evT[rand(evT.length)]; S.used.add(t); return t; }
  const pool = TOPICS.filter(t => !S.used.has(t));
  const list = pool.length ? pool : TOPICS;
  const t = list[rand(list.length)];
  S.used.add(t);
  return t;
}

function makeChoices(topic) {
  const decoys = shuffle(TOPICS.filter(t => t !== topic)).slice(0, 5);
  return shuffle([topic, ...decoys]);
}

function newRound() {
  editingTopic = false;
  const others = shuffle(Object.keys(AXES).filter(k => k !== 'match')).slice(0, 2);
  let judge;
  do { judge = JUDGES[rand(JUDGES.length)]; } while (judge.id === S.lastJudge);
  S.lastJudge = judge.id;
  const cur = { topic: pickTopic(), axes: S.mode === 'guess' ? [] : ['match', ...others], judge, rerolled: false, pi: 0, drawings: [], rule: null, choices: null };
  if (S.mode === 'attack') {
    let r;
    do { r = RULES[rand(RULES.length)]; } while (r.id === S.lastRule);
    S.lastRule = r.id;
    cur.rule = { ...r };
    if (r.id === 'tri') cur.rule.colors = shuffle(COLORS.map(c => c[0])).slice(0, 3);
  }
  if (S.mode === 'guess') cur.choices = makeChoices(cur.topic);
  if (S.challenge) cur.rerolled = true;
  S.cur = cur;
  showIntro();
}

/* ---------- ペンの種類 ---------- */
const PENS = [['normal', '✏️', 'ふつう', 'n'], ['marker', '🖊️', 'マーカー', 'r'], ['crayon', '🖍️', 'クレヨン', 'r'], ['rainbow', '🌈', 'レインボー', 'sr'], ['sparkle', '✨', 'キラキラ', 'sr'], ['neon', '💡', 'ネオン', 'hr']];

const penAllowed = id => !(D.rule && ['mono', 'tri'].includes(D.rule.id) && ['rainbow', 'sparkle'].includes(id));
function tracePath(c, p) {
  c.beginPath(); c.moveTo(p[0].x, p[0].y);
  for (let i = 1; i < p.length - 1; i++) { const mx = (p[i].x + p[i + 1].x) / 2, my = (p[i].y + p[i + 1].y) / 2; c.quadraticCurveTo(p[i].x, p[i].y, mx, my); }

}
function starPath(c, x, y, r) {
  c.beginPath();
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 - Math.PI / 2, rr = k % 2 ? r * 0.38 : r; c[k ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr); }

}
const PEN_FN = {
  rainbow(c, s) {
    const p = s.points, base = (s.seed || 0) % 360;
    c.lineCap = 'round'; c.lineJoin = 'round'; c.lineWidth = s.size;
    if (p.length === 1) { c.fillStyle = `hsl(${base},90%,55%)`; c.beginPath(); c.arc(p[0].x, p[0].y, s.size / 2, 0, Math.PI * 2); c.fill(); return; }
    let d = 0;
    for (let i = 1; i < p.length; i++) {
      d += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
      c.strokeStyle = `hsl(${(base + d * 0.45) % 360},90%,55%)`;
      c.beginPath(); c.moveTo(p[i - 1].x, p[i - 1].y); c.lineTo(p[i].x, p[i].y); c.stroke();
    }
  },
  sparkle(c, s) {
    const p = s.points, r = mulberry(s.seed || 1), cols = ['#FFC107', '#FF5FB7', '#39B8FF', '#9B6CFF'];
    c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = s.size * 0.8;
    if (p.length === 1) { c.beginPath(); c.arc(p[0].x, p[0].y, s.size * 0.4, 0, Math.PI * 2); c.fill(); } else { tracePath(c, p); c.stroke(); }
    let acc = 0;
    for (let i = 0; i < p.length; i++) {
      if (i) acc += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
      if (i === 0 || acc > 30) {
        acc = 0;
        const a = r() * Math.PI * 2, dist = s.size * (0.5 + r() * 1.3), sz = 7 + r() * 9, col = cols[Math.floor(r() * cols.length)];
        c.fillStyle = col; starPath(c, p[i].x + Math.cos(a) * dist, p[i].y + Math.sin(a) * dist, sz); c.fill();
      }
    }
  },
  neon(c, s) {
    const p = s.points;
    c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = s.color; c.fillStyle = s.color;
    const passes = [[2.6, 0.16, s.color], [1.7, 0.3, s.color], [1, 1, s.color], [0.34, 0.95, '#ffffff']];
    for (const [k, al, col] of passes) {
      c.globalAlpha = al; c.strokeStyle = col; c.fillStyle = col; c.lineWidth = s.size * k;
      if (p.length === 1) { c.beginPath(); c.arc(p[0].x, p[0].y, s.size * k / 2, 0, Math.PI * 2); c.fill(); } else { tracePath(c, p); c.stroke(); }
    }
    c.globalAlpha = 1;
  },
  crayon(c, s) {
    const p = s.points;
    c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = s.color; c.fillStyle = s.color;
    for (let k = 0; k < 3; k++) {
      const r = mulberry((s.seed || 1) + k * 7919), j = s.size * 0.3;
      const q = p.map(pt => ({ x: pt.x + (r() - 0.5) * j, y: pt.y + (r() - 0.5) * j }));
      c.globalAlpha = 0.5; c.lineWidth = s.size * (0.6 + k * 0.18);
      if (q.length === 1) { c.beginPath(); c.arc(q[0].x, q[0].y, c.lineWidth / 2, 0, Math.PI * 2); c.fill(); }
      else { c.beginPath(); c.moveTo(q[0].x, q[0].y); for (let i = 1; i < q.length; i++) c.lineTo(q[i].x, q[i].y); c.stroke(); }
    }
    const r2 = mulberry((s.seed || 1) ^ 0x5bd1e995);
    c.globalAlpha = 0.45;
    for (let i = 0; i < p.length; i++) {
      for (let m = 0; m < 2; m++) { const a = r2() * Math.PI * 2, d = r2() * s.size * 0.7, rad = 0.8 + r2() * 1.8; c.beginPath(); c.arc(p[i].x + Math.cos(a) * d, p[i].y + Math.sin(a) * d, rad, 0, Math.PI * 2); c.fill(); }
    }
    c.globalAlpha = 1;
  },
  marker(c, s) {
    const p = s.points;
    c.lineCap = 'square'; c.lineJoin = 'bevel'; c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = s.size * 1.3; c.globalAlpha = 0.5;
    if (p.length === 1) { c.fillRect(p[0].x - c.lineWidth / 2, p[0].y - c.lineWidth / 2, c.lineWidth, c.lineWidth); } else { tracePath(c, p); c.stroke(); }

};
function buildPens() {
  const box = $('#pens');
  if (D.blind) { box.hidden = true; return; }
  box.hidden = false;
  if (!penAllowed(D.pen) || !penOwned(D.pen)) D.pen = 'normal';
  box.replaceChildren(...PENS.filter(([id]) => penOwned(id) && penAllowed(id)).map(([id, ico, name]) =>
    h('button', { class: 'pn', type: 'button', 'data-pen': id, 'aria-label': name + 'ペン', 'aria-pressed': 'false', onclick: () => { D.pen = id; D.erase = false; syncTools(); } }, ico)));
}

function strokePath(c, s) {
  if (s.pen && s.pen !== 'normal' && !s.erase && PEN_FN[s.pen]) { c.save(); PEN_FN[s.pen](c, s); c.restore(); return; }
  c.strokeStyle = s.color; c.fillStyle = s.color; c.lineWidth = s.size; c.lineCap = 'round'; c.lineJoin = 'round';
  const p = s.points;
  if (p.length === 1) { c.beginPath(); c.arc(p[0].x, p[0].y, s.size / 2, 0, Math.PI * 2); c.fill(); return; }
  c.beginPath(); c.moveTo(p[0].x, p[0].y);
  for (let i = 1; i < p.length - 1; i++) {
    const mx = (p[i].x + p[i + 1].x) / 2, my = (p[i].y + p[i + 1].y) / 2;
    c.quadraticCurveTo(p[i].x, p[i].y, mx, my);

}
function redraw() {
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  D.strokes.forEach(s => strokePath(ctx, s));
}
function toPt(e) {
  const r = cv.getBoundingClientRect();
  const cw = cv.clientWidth || r.width, ch = cv.clientHeight || r.height;
  return { x: (e.clientX - r.left - cv.clientLeft) * (W / cw), y: (e.clientY - r.top - cv.clientTop) * (H / ch) };

cv.addEventListener('pointerdown', e => {
  if (!D.drawing || D.cur) return;

  D.ptr = e.pointerId;
  D.cur = { color: D.erase ? '#ffffff' : D.color, size: D.erase ? Math.max(D.size, 24) : D.size, erase: D.erase, pen: D.erase ? 'normal' : D.pen, seed: (Math.random() * 1e9) | 0, points: [toPt(e)] };

cv.addEventListener('pointermove', e => {
  if (!D.drawing || !D.cur || e.pointerId !== D.ptr) return;

  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];

const endStroke = e => { if (D.cur && e.pointerId === D.ptr) { D.cur = null; D.ptr = null; if (D.one) finishDraw('done'); } };

cv.addEventListener('pointercancel', endStroke);

$('#btn-undo').addEventListener('click', () => { if (!D.drawing) return; D.cur = null; D.strokes.pop(); redraw(); });
$('#btn-clear').addEventListener('click', e => {

function startDraw() {

function exportCanvas(q = 0.86) {
  const t = document.createElement('canvas');

async function finishDraw(why) {

  D.drawing = false; D.cur = null;
  clearInterval(D.timer);

  const blob = await exportCanvas(S.online ? 0.62 : 0.86);

function startVote() {
  const c = S.cur, n = c.drawings.length;

        h('div', { style: 'font-weight:800;margin-bottom:6px' }, S.players[i] + ' さんの絵'),
        h('img', { src: d.url, alt: S.players[i] + 'の絵', style: 'width:100%;max-height:34vh;object-fit:contain;background:#fff;border-radius:12px;border:3px solid var(--ink)' }),
        row));
    });

      h('div', { style: 'font-weight:900;font-size:18px;text-align:center' }, S.players[v] + ' さんの番：他の人の絵に ★ をつけよう'),

// AIの返事のJSONが少し崩れていても読めるようにする(コメント内の " や、文字列中の改行、末尾のカンマなど)
function lenientJSON(text) {
  const a = text.indexOf('{');
  if (a < 0) throw { code: 'parse', detail: 'no_json' };
  const b = text.lastIndexOf('}');
  const raw = text.slice(a, b > a ? b + 1 : text.length);
  try { return JSON.parse(raw); } catch (e) {}
  // 文字を1つずつ見て直す
  let out = '', inStr = false;
  for (let i = 0; i < raw.length; i++) {
    const ch = raw[i];
    if (!inStr) { out += ch; if (ch === '"') inStr = true; continue; }
    if (ch === '\\') { out += ch + (raw[i + 1] || ''); i++; continue; }
    if (ch === '"') {
      const nx = (raw.slice(i + 1).match(/^\s*(\S)/) || [])[1];
      if (nx === undefined || ',:}]'.includes(nx)) { out += ch; inStr = false; } else out += '\\"';
      continue;
    }
    if (ch === '\n') { out += '\\n'; continue; }
    if (ch === '\r' || ch === '\t') { out += ' '; continue; }
    out += ch;
  }
  if (inStr) out += '"';
  out = out.replace(/,\s*([}\]])/g, '$1');
  // 閉じ括弧が足りないとき(途中で切れた)を補う
  let open = 0, ob = 0, q = false;
  for (let i = 0; i < out.length; i++) { const c = out[i]; if (c === '\\' && q) { i++; continue; } if (c === '"') q = !q; else if (!q) { if (c === '{') open++; else if (c === '}') open--; else if (c === '[') ob++; else if (c === ']') ob--; } }
  out += ']'.repeat(Math.max(0, ob)) + '}'.repeat(Math.max(0, open));
  try { return JSON.parse(out); }
  catch (e) { try { console.warn('bad_json:', text.slice(0, 400)); } catch (_) {} throw { code: 'parse', detail: 'bad_json' }; }
}
function parseGuess(text) {
  const obj = lenientJSON(text);
  const pick = Math.round(Number(obj.pick));
  if (!(pick >= 1 && pick <= S.cur.choices.length)) throw { code: 'parse', detail: 'bad_pick' };
  const conf = Math.max(0, Math.min(100, Math.round(Number(obj.confidence)) || 0));
  return { pickIndex: pick - 1, seen: String(obj.seen || '').slice(0, 40), conf, comment: String(obj.comment || '').slice(0, 90) };
}

function parseAI(text, sent) {
  const obj = lenientJSON(text);
  const map = {};
  for (const p of (obj.players || [])) {
    const pi = sent[Number(p.index) - 1];
    if (pi === undefined) continue;
    const scores = {};
    const got = S.cur.axes.map(k => Math.round(Number(p.scores && p.scores[k]))).filter(Number.isFinite);
    if (!got.length) throw { code: 'parse', detail: 'no_scores' };
    const fallback = Math.round(got.reduce((x, y) => x + y, 0) / got.length);
    for (const k of S.cur.axes) {
      const v = Math.round(Number(p.scores && p.scores[k]));
      scores[k] = Math.max(0, Math.min(10, Number.isFinite(v) ? v : fallback));
    }
    map[pi] = { scores, comment: String(p.comment || '').slice(0, 90), seen: String(p.seen || '').slice(0, 40) };
  }
  for (const pi of sent) if (!map[pi]) throw { code: 'parse', detail: 'missing_player' };
  return { summary: String(obj.summary || '').slice(0, 130), map };
}

const sleepMs = ms => new Promise(r => setTimeout(r, ms));
async function askAI(sent) {
  let last;
  for (let i = 0; i < 3; i++) {
    try { return await askAIOnce(sent); }
    catch (e) {
      last = e;
      const code = e && e.code;
      if (i === 2 || !['parse', 'server', 'network', 'rate_limited'].includes(code)) throw e;
      await sleepMs(code === 'rate_limited' ? 5000 : 1200 * (i + 1));
    }
  }
  throw last;
}

async function askAIOnce(sent) {
  const c = S.cur, guess = S.mode === 'guess';
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 90000);
  try {
    const res = await S.ai.sample(guess ? buildGuessPrompt() : buildPrompt(sent), {
      images: sent.map(pi => c.drawings[pi].blob),
      modelTier: 'default', cache: false, signal: ctrl.signal
    });
    if (!res || res.truncated || !res.text) throw { code: 'parse', detail: res && res.truncated ? 'truncated' : 'empty' };
    return guess ? parseGuess(res.text) : parseAI(res.text, sent);
  } catch (e) {
    if (ctrl.signal.aborted) throw { code: 'timeout' };
    throw e;
  } finally { clearTimeout(to); }
}

/* ---------- ハート(AI審査の回数) ---------- */
const HEART_MAX = 5, HEART_MS = 30 * 60 * 1000;
function heartState() {
  let hp = HEART_MAX, at = 0;
  const p = NET.state === 'ready' && NET.players && NET.players[NET.me];

  if (NET.state !== 'ready' || !PROFILE) return Promise.resolve();

    await ref.set({ name: PROFILE.name, shape: PROFILE.shape, code, ts: Date.now(), ...(typeof old.xp === 'number' ? { xp: old.xp } : {}), ...(typeof old.xpAt === 'number' ? { xpAt: old.xpAt } : {}), ...(typeof old.hp === 'number' ? { hp: old.hp } : {}), ...(typeof old.hpAt === 'number' ? { hpAt: old.hpAt } : {}) });

/* --- 引き継ぎ: 連携ずみのアカウントなら、クラウドのプロフィールを読み込む --- */
async function adoptCloudProfile() {
  try {
    const sn = await NET.db.doc('players/' + NET.me).get();
    if (!sn.exists) return;
    const d = sn.data();
    if (!d || !d.name) return;
    PROFILE = { name: String(d.name).slice(0, 8), shape: [0, 1, 2, 3].includes(d.shape) ? d.shape : 0 };

    updateChip();

function accountBlock(editing) {
  const api = window.__fbAuth;
  if (!api) return null;
  const info = api.info();
  if (!info.anonymous) {
    return h('div', { class: 'card stack', style: 'text-align:center' },

      h('small', { style: 'font-weight:700;opacity:.85' }, '別の端末でも、同じGoogleアカウントでログインすれば、名前・友達コード・友達がそのまま使えます。'));
  }
  const errMsg = e => {
    const c = e && e.code || '';
    if (c === 'auth/popup-closed-by-user' || c === 'auth/cancelled-popup-request') return '';
    if (c === 'auth/popup-blocked') return 'ポップアップがブロックされました。ブラウザの設定で許可してね';
    if (c === 'auth/operation-not-allowed') return 'Googleログインがまだ有効になっていません（運営側の設定が必要です）';
    if (c === 'auth/unauthorized-domain') return 'このサイトはGoogleログインが許可されていません（運営側の設定が必要です）';

  };
  const b = h('button', { class: 'btn', type: 'button', onclick: async () => {

      showToast('連携しました！'); showReg(editing);
    } catch (e) { const m = errMsg(e); if (m) showToast(m); b.disabled = false; }
  } }, editing ? '🔗 Googleアカウントと連携する（引き継ぎ設定）' : '🔗 すでにアカウントがある → Googleで引き継ぐ');
  return h('div', { class: 'stack', style: 'align-items:stretch' }, b,

}

/* --- net init --- */
async function netInit() {
  let use = window.claude && window.claude.use ? n => window.claude.use(n) : async () => null;
  const fbc = window.DRAW_CONFIG && window.DRAW_CONFIG.firebase;
  if (!(window.claude && window.claude.use) && fbc && window.__fbInit) {
    try { use = (await window.__fbInit(fbc)).use; } catch (e) { console.warn('firebase init failed', e); }
  }
  try { NET.db = await use('db'); } catch (e) {}
  try { NET.user = await use('user'); } catch (e) {}
  if (NET.user) { try { NET.me = await NET.user.id(); } catch (e) {} }
  let can = null;
  if (NET.user) { try { can = await NET.user.can('data.write'); } catch (e) {} }
  NET.state = !NET.db ? 'nodb' : !NET.me ? 'noid' : can === false ? 'ro' : 'ready';
  if (NET.state === 'ready') {
    if (!PROFILE) await adoptCloudProfile();
    startNet(); pushProfile().then(flushXp);
  }
  use('room').then(r => { NET.room = r; if (r && NET.state === 'ready') startRoom(); }).catch(() => {});
  refreshOnline();
  updateTabbar();
  if ($('#scr-title').classList.contains('active')) renderSetup();
  if (!PROFILE && $('#scr-reg').classList.contains('active') && window.__fbAuth && !($('#reg-name') && $('#reg-name').value)) showReg(false);
}

function startNet() {
  if (NET.started) return;
  NET.started = true;
  const { db, me } = NET, bad = () => {};
  startGacha();
  db.collection('players').onSnapshot(sn => { const m = {}; sn.docs.forEach(d => { m[d.id] = d.data(); }); NET.players = m; refreshOnline(); refreshRankCard(); if (PROFILE) updateChip(); autoGrants(); processPendingFriend(); }, bad);
  db.doc(`data/users/${me}/friends`).onSnapshot(sn => { NET.friends = sn.exists && Array.isArray(sn.data().ids) ? sn.data().ids : []; refreshOnline(); }, bad);
  db.collection('requests').where('to', '==', me).onSnapshot(sn => { NET.reqIn = sn.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.status === 'pending').filter(r => { if (!isBlocked(r.from)) return true; ignoreFriend(r); return false; }); notifyNewRequests(); updateOnlineBadge(); refreshOnline(); }, bad);
  db.collection('requests').where('from', '==', me).onSnapshot(sn => { NET.reqOut = sn.docs.map(d => ({ id: d.id, ...d.data() })); handleAccepted(); refreshOnline(); }, bad);
}

function dataURLtoBlob(u) {
  const [m, b64] = u.split(',');
  const mime = (m.match(/:(.*?);/) || [])[1] || 'image/jpeg';
  const bin = atob(b64), a = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return new Blob([a], { type: mime });
}

function assignShapes(list) {
  const used = new Set();
  return list.map(m => {
    let k = Number.isInteger(m.shape) && m.shape >= 0 && m.shape < 4 ? m.shape : 0;
    if (used.has(k)) k = [0, 1, 2, 3].find(x => !used.has(x));
    used.add(k);
    return k;
  });
}

/* --- room: sync --- */
function prepareS(d) {
  S.online = { code: G.code, isHost: G.isHost };
  S.mode = 'battle';
  S.players = d.names || []; S.avIdx = d.shapes || null; S.total = d.total; S.secs = d.secs; S.round = d.round;
  S.cur = { topic: d.topic, axes: d.axes || [], judge: JUDGES.find(j => j.id === d.judge) || JUDGES[0], rerolled: !!d.rerolled, custom: !!d.custom, pi: Math.max(0, (d.order || []).indexOf(NET.me)), drawings: [], rule: null, choices: null };
}

function onGameDoc(sn) {
  if (!G.code) return;
  if (!sn.exists) {
    if (!G.isHost) { resetLocalRoom(); showOnline(); showToast('ルームが閉じられました'); }
    return;
  }
  const d = sn.data();
  G.game = d;
  const key = `${d.gen}:${d.round}:${d.phase}`;
  const fresh = key !== G.key;
  G.key = key;
  if (d.phase !== 'draw' && D.drawing) { D.drawing = false; clearInterval(D.timer); }
  if (d.phase === 'lobby') {
    S.avIdx = null;
    if (!$('#scr-lobby').classList.contains('active')) { go('lobby'); SND.bgm('menu'); }
    renderLobby();
    return;
  }
  if (!d.order || d.order.indexOf(NET.me) < 0) { leaveRoom(); showToast('ゲームがもう始まっています'); return; }
  if (d.phase === 'judging') { if (fresh && !G.isHost) { go('judge'); SND.bgm(null); G.stopJudge = judgeLoading(); } return; }
  if (d.phase === 'intro') { if (fresh) editingTopic = false; prepareS(d); showIntroOnline(fresh); return; }
  if (!fresh) return;
  prepareS(d);
  if (d.phase === 'draw') { G.myDone = false; startDraw(); }
  else if (d.phase === 'result') tryShowResult();
  else if (d.phase === 'final') tryShowFinal();
}

function buildHistory(d, upto) {
  S.history = [];
  S.totals = Array(d.order.length).fill(0);
  for (let r = 0; r <= upto; r++) {
    const doc = G.results[`${d.gen}_${r}`];
    if (!doc) return false;
    const results = doc.results.map((x, i) => {
      const dr = G.drawings[`${d.gen}_${r}_${x.uid}`];
      S.totals[i] += x.total;
      return { url: dr && dr.img ? dr.img : '', blank: !!x.blank, scores: x.scores || {}, bonus: x.bonus || 0, total: x.total, comment: x.comment || '', seen: x.seen || '' };
    });
    S.history.push({ topic: doc.topic, judge: JUDGES.find(j => j.id === doc.judge) || JUDGES[0], axes: doc.axes || [], results, summary: doc.summary || '', rule: null, choices: null });
  }
  return true;
}
function drawingsReady(d, doc) {
  return doc.results.every(x => x.blank || G.drawings[`${d.gen}_${doc.round}_${x.uid}`]);
}
function tryShowResult() {
  const d = G.game;
  if (!d || d.phase !== 'result' || G.shownKey === G.key) return;
  const doc = G.results[`${d.gen}_${d.round}`];
  if (!doc || !drawingsReady(d, doc)) return;
  if (!buildHistory(d, d.round)) return;
  G.shownKey = G.key;
  if (G.stopJudge) { G.stopJudge(); G.stopJudge = null; }
  prepareS(d);
  showResult();
}
function tryShowFinal() {
  const d = G.game;
  if (!d || d.phase !== 'final' || G.shownKey === G.key) return;

async function hostJudge(retry) {
  const d = G.game;

  G.judging = true;

  S.cur.drawings = d.order.map(u => {

  });
  go('judge'); SND.bgm(null);
  const stop = judgeLoading();
  const sent = S.cur.drawings.map((x, i) => i).filter(i => !S.cur.drawings[i].blank);
  let ai = null;
  try { if (sent.length) { ai = await askAI(sent); chargeHeart(); } }
  catch (err) { stop(); judgeError(err, () => hostJudge(true), null); return; }
  stop();
  try {
    const results = computeResults(ai).map((r, i) => ({ uid: d.order[i], scores: r.scores || {}, bonus: 0, total: r.total, comment: r.comment, seen: r.seen, blank: !!r.blank }));
    await gq(() => NET.db.doc(`games/${G.code}/results/${d.gen}_${d.round}`).set({ gen: d.gen, round: d.round, topic: S.cur.topic, axes: S.cur.axes, judge: S.cur.judge.id, summary: ai && ai.summary ? ai.summary : '', results }));
    await gameUpdate({ phase: 'result' });
    G.judging = false;
  } catch (e) { judgeError({ code: 'x' }, () => hostJudge(true), null); }
}

const ALB = {
  p: null, urls: [],
  open() {
    if (!this.p) this.p = new Promise((res, rej) => {
      try {
        const q = indexedDB.open('dbAlbum', 1);
        q.onupgradeneeded = () => q.result.createObjectStore('w', { keyPath: 'topic' });
        q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error);
      } catch (e) { rej(e); }
    });
    return this.p;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('w', mode), r = fn(t.objectStore('w')); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  },
  all() { return this.tx('readonly', st => st.getAll()).then(a => a || []); },
  get(t) { return this.tx('readonly', st => st.get(t)); },
  put(rec) { return this.tx('readwrite', st => st.put(rec)); },
  del(t) { return this.tx('readwrite', st => st.delete(t)); }
};

async function albumCollect(hist) {

    else if (S.online && G.game) pi = (G.game.order || []).indexOf(NET.me);
    const r = hist.results[pi];
    if (!r || r.blank || !r.url) return;
    const max = S.mode === 'guess' ? 100 : 30, norm = Math.max(0, Math.min(1, (r.total || 0) / max));
    const old = await ALB.get(hist.topic);
    const rec = { topic: hist.topic, plays: ((old && old.plays) || 0) + 1, first: (old && old.first) || Date.now() };
    if (old && old.norm >= norm) { await ALB.put({ ...old, plays: rec.plays }); return; }
    const img = await albumThumb(r.url);
    await ALB.put({ ...rec, norm, score: r.total, max, mode: S.online ? 'online' : S.mode, judge: hist.judge ? hist.judge.id : '', cmt: String(r.comment || '').slice(0, 80), ts: Date.now(), img });
  } catch (e) {}
}

const hash32 = str => { let x = 2166136261; for (const ch of String(str)) { x ^= ch.charCodeAt(0); x = Math.imul(x, 16777619); } return x >>> 0; };
const mulberry = a => () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const todayJST = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
function dailySpec(date) {
  const r = mulberry(hash32('draw-battle-' + date));
  const topic = TOPICS[Math.floor(r() * TOPICS.length)];
  const judge = JUDGES[Math.floor(r() * JUDGES.length)];
  const keys = Object.keys(AXES).filter(k => k !== 'match');
  for (let i = keys.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [keys[i], keys[j]] = [keys[j], keys[i]]; }
  return { topic, judge, axes: ['match', ...keys.slice(0, 2)] };
}

/* ---------- ランク(XP) ---------- */
const RANKS = [[0, 'らくがき見習い'], [50, '落書き小僧'], [150, '下書き名人'], [300, 'スケッチ職人'], [500, '色づかいの達人'], [800, '筆の魔術師'], [1200, '画伯見習い'], [1800, '画伯'],
  [2600, '名匠'], [3600, '巨匠'], [4900, '鬼才'], [6500, '天才'], [8500, '神童'], [11000, '絵の神様'], [14000, '伝説の絵描き']];
function rankOf(xp) {
  let i = 0;
  while (i + 1 < RANKS.length && xp >= RANKS[i + 1][0]) i++;
  const cur = RANKS[i][0], nxt = i + 1 < RANKS.length ? RANKS[i + 1][0] : null;
  return { lv: i + 1, name: RANKS[i][1], cur, nxt, nextName: nxt != null ? RANKS[i + 1][1] : '', pct: nxt != null ? Math.min(100, Math.round((xp - cur) / (nxt - cur) * 100)) : 100 };
}
const pendXp = () => { try { return Math.max(0, Number(localStorage.getItem('dbXpPend')) || 0); } catch (e) { return 0; } };
const setPend = n => { try { localStorage.setItem('dbXpPend', String(Math.max(0, Math.round(n)))); } catch (e) {} };
const cloudXp = uid => { const p = NET.players && NET.players[uid]; return p && typeof p.xp === 'number' ? p.xp : 0; };
let xpInflight = 0; // サーバーに送っている最中の経験値(二重に数えない)
const myXp = () => cloudXp(NET.me) + Math.max(0, pendXp() - xpInflight);
const lvTag = uid => 'Lv.' + rankOf(uid === NET.me ? myXp() : cloudXp(uid)).lv;
let xpTimer = 0;
function flushXp() {
  if (NET.state !== 'ready' || !PROFILE) return Promise.resolve();
  pushing = pushing.then(async () => {
    const pend = pendXp();
    if (pend <= 0) return;
    const ref = NET.db.doc('players/' + NET.me);
    const cur = await ref.get();
    if (!cur.exists) return;
    const old = cur.data(), now = Date.now(), at = old.xpAt || 0;
    if (now < at + 20500) { clearTimeout(xpTimer); xpTimer = setTimeout(flushXp, at + 20500 - now + 200); return; }
    const grant = Math.min(pend, 38);
    xpInflight = grant;
    try { await ref.update({ xp: (old.xp || 0) + grant, xpAt: now }); setPend(pend - grant); } finally { xpInflight = 0; }
    if (pend - grant > 0) { clearTimeout(xpTimer); xpTimer = setTimeout(flushXp, 21000); }
    refreshRankCard();
  }).catch(() => {});
  return pushing;
}
function awardXp(rec) {
  try {
    const rounds = Math.max(1, rec.rd || rec.n || 1), max = rec.kind === 'guess' ? 100 : 30;
    const q = Math.min(1, (rec.score || 0) / rounds / max);
    let gain = 6 + 3 * Math.min(rounds, 5);
    gain += q >= 0.9 ? 10 : q >= 0.75 ? 6 : q >= 0.6 ? 3 : 0;
    if (rec.kind === 'daily') gain += 10 + (dailyStreak(loadHistory()) >= 3 ? 3 : 0);
    const day = todayJST();
    let last = ''; try { last = localStorage.getItem('dbXpDay') || ''; } catch (e) {}
    if (last !== day) { gain += 5; try { localStorage.setItem('dbXpDay', day); } catch (e) {} }
    gain = Math.min(gain, 38);
    const before = rankOf(myXp());
    setPend(pendXp() + gain);
    const after = rankOf(myXp());
    if (after.lv > before.lv) { showToast(`🎉 ランクアップ！ Lv.${after.lv}「${after.name}」 (+${gain}XP)`); SND.sfx('win'); }
    else showToast(`+${gain} XP　Lv.${after.lv}「${after.name}」` + (after.nxt != null ? `　あと${after.nxt - myXp()}XP` : ''));
    refreshRankCard(); updateChip();
    flushXp();
  } catch (e) {}
}
function rankCardKids() {
  const r = rankOf(myXp());
  return [
    h('div', { style: 'display:flex;justify-content:space-between;align-items:baseline;gap:8px' },

const G_RATE = [['miss', 40], ['r', 30], ['sr', 17], ['hr', 8], ['lr', 4], ['sec', 1]];
const DUP_SHARDS = { r: 3, sr: 8, hr: 20, lr: 50, sec: 130 };
const SWAP_COST = { r: 10, sr: 25, hr: 60, lr: 150, sec: 400 };
const MAX_TIX = 10;
const RAR_ORDER = ['r', 'sr', 'hr', 'lr', 'sec'];
const RAR_STAR = { r: '★ レア', sr: '★★ スーパーレア', hr: '★★★ ハイパーレア', lr: '★★★★ レジェンドレア', sec: '？？？ シークレット' };
const RAR_COL = { r: '#6FB1FF', sr: '#FFC933', hr: '#C28BFF', lr: '#FF8A3D', sec: '#FFD23F' };
const GDEF = () => ({ tix: 0, shards: 0, own: [], day: '', lvg: 1, gifts: [], pulls: 0, hx: 0, inv: [], mdd: 0, mwk: 0, evs: [] });
let dbgKind = null, gTab = 'zukan';
function gItems() {
  return [
    ...STAMPS.filter(d => d[3] !== 'n').map(d => ({ id: d[0], kind: 'stamp', rar: d[3], name: d[2], disp: d[1], def: d, ev: d[6] || null, give: !!d[7] })),
    ...PENS.filter(p => p[3] !== 'n').map(p => ({ id: 'p_' + p[0], kind: 'pen', rar: p[3], name: p[2] + 'ペン', disp: p[1], ev: null }))
  ].filter(it => !it.ev || gOwned(it.id) || evActive(it.ev)).sort((a, b) => RAR_ORDER.indexOf(a.rar) - RAR_ORDER.indexOf(b.rar));
}
const gState = () => ({ ...GDEF(), ...(NET.gacha || {}) });
const gOwned = id => gState().own.includes(id);
function gSave(next) {
  NET.gacha = next; NET.gachaExists = true;
  if (NET.state === 'ready') pushing = pushing.then(() => NET.db.doc('gacha/' + NET.me).set(next)).catch(() => {});
  gUpdateBadge();

}
// 招待ボーナス: 招待した人=2枚、招待された人=1枚(1人10回まで)
async function gClaimInvite(reqId, role) {

  if (g.inv.includes(reqId) || g.inv.length >= 10) return 0;
  const add = Math.min(role === 'inviter' ? 2 : 1, MAX_TIX - g.tix);
  await gSave({ ...g, inv: [...g.inv, reqId], tix: g.tix + add });

}

function startGacha() {

// 毎日1枚・ランクアップで1枚を自動で受け取る
function autoGrants() {
  if (NET.state !== 'ready' || !PROFILE || !NET.gachaLoaded) return;
  const g = gState(), day = todayJST(), nx = { ...g }, got = [];
  if (g.day !== day && nx.tix < MAX_TIX) { nx.day = day; nx.tix++; got.push('今日のガチャ券'); }
  const lv = rankOf(cloudXp(NET.me)).lv;
  if (NET.gachaExists && NET.players[NET.me] && lv > g.lvg) {
    const can = Math.min(lv - g.lvg, MAX_TIX - nx.tix);
    if (can > 0) { nx.lvg = g.lvg + can; nx.tix += can; got.push(`ランクアップ券×${can}`); }
  }
  if (!got.length) return;
  gSave(nx);
  showToast('🎁 ' + got.join('・') + 'をもらいました', 'ひく', showGacha);
}
function rollKind() {
  if (dbgKind) return dbgKind;
  const r = Math.random() * 100; let acc = 0;
  for (const [k, p] of G_RATE) { acc += p; if (r < acc) return k; }
  return 'miss';
}
function doPull() {
  const g = gState();
  if (g.tix < 1) return null;
  const kind = rollKind(), nx = { ...g, tix: g.tix - 1, pulls: g.pulls + 1 };
  let res;
  if (kind === 'miss') { nx.hx = Math.min(20, g.hx + 1); nx.shards = g.shards + 2; res = { kind }; }
  else {
    const pool = gItems().filter(i => i.rar === kind && !i.give).flatMap(i => i.ev ? [i, i, i] : [i]), it = pool[Math.floor(Math.random() * pool.length)];
    if (g.own.includes(it.id)) { const sh = DUP_SHARDS[kind]; nx.shards = g.shards + sh; res = { kind, item: it, dup: true, shards: sh }; }
    else { nx.own = [...g.own, it.id]; res = { kind, item: it, dup: false }; }
  }
  gSave(nx);
  { const mm = misLoad(); evCount(mm, 'pull', 1); misSave(mm); misBadge(); refreshEvBanner(); }
  return res;
}
function swapItem(it) {
  const g = gState(), cost = SWAP_COST[it.rar];
  if (g.own.includes(it.id) || g.shards < cost) return false;
  gSave({ ...g, shards: g.shards - cost, own: [...g.own, it.id] });
  return true;
}
function claimGift(gf) {
  const g = gState(); if (g.gifts.includes(gf.id)) return;
  const tix = Math.min(gf.tix || 0, MAX_TIX - g.tix);
  gSave({ ...g, gifts: [...g.gifts, gf.id], tix: g.tix + tix, shards: g.shards + Math.max(0, gf.shards || 0) });
  showToast('🎁 受け取りました！' + (tix < (gf.tix || 0) ? '（券は上限の10枚まで）' : ''));
  renderGacha();
}

function boot(saved) {
  if (saved && typeof saved === 'object') {
    if ([2, 3, 4].includes(saved.n)) S.n = saved.n;
    if (Array.isArray(saved.names)) S.names = saved.names.slice(0, 4).map(x => String(x || '').slice(0, 8)).concat(['', '', '', '']).slice(0, 4);
    if ([1, 3, 5].includes(saved.rounds)) S.rounds = saved.rounds;
    if ([30, 45, 60].includes(saved.secs)) S.secs = saved.secs;
    if (['battle', 'attack', 'guess'].includes(saved.mode)) S.mode = saved.mode;
    if ([3, 5, 10].includes(saved.soloRounds)) S.soloRounds = saved.soloRounds;
    if (typeof saved.soloName === 'string') S.soloName = saved.soloName.slice(0, 8);
  }
  renderTitle();
  initAI();
  updateChip();
  netInit();
  if (!PROFILE) showReg(false);
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(() => ({ n: S.n, names: S.names, rounds: S.rounds, secs: S.secs, mode: S.mode, soloRounds: S.soloRounds, soloName: S.soloName }));
  }
}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
